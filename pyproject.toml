[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "2.0.1"
description = "Vulnerability reachability scanner — proves which CVEs are actually reachable"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "packaging>=21",
    "requests>=2.32",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.135",
    "uvicorn>=0.40",
    "psycopg2-binary>=2.9",
    "slowapi>=0.1",
]
llm = [
    "anthropic>=0.85",
    "openai>=2.0",
]
taint = [
    "tainter",
]
full = [
    "vulnreach[server,llm,taint]",
]

[project.scripts]
vulnreach = "vulnreach.cli.main:cli"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "api*",
    "config*",
    "core*",
    "correlation*",
    "intelligent_dast*",
    "storage*",
    "vulnreach*",
]

# Coverage exclusions live here rather than on the pytest command line: the CI
# job passed `--cov-omit=...`, which is not a pytest-cov option and never has
# been (checked against 2.12.1 through 7.1.0). pytest rejected it during
# argument parsing, so the `--cov-fail-under=60` gate in that job has never
# actually run. coverage.py reads this section itself, so the exclusions apply
# to every invocation rather than only the one that remembers the flag.
[tool.coverage.run]
omit = [
    "labs/*",
    "tests/*",
    "*/__pycache__/*",
    "*.pyc",
]
