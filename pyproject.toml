[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "2.0.1"
description = "Vulnerability reachability scanner — proves which CVEs are actually reachable"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "packaging>=21",
    "requests>=2.32",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.135",
    "uvicorn>=0.40",
    "psycopg2-binary>=2.9",
    "slowapi>=0.1",
]
llm = [
    "anthropic>=0.85",
    "openai>=2.0",
]
taint = [
    "tainter",
]
full = [
    "vulnreach[server,llm,taint]",
]

[project.scripts]
vulnreach = "vulnreach.cli.main:cli"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "api*",
    "config*",
    "core*",
    "correlation*",
    "intelligent_dast*",
    "storage*",
    "vulnreach*",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
omit = [
    "labs/*",
    "tests/*",
    "*/__pycache__/*",
    "*.pyc",
]